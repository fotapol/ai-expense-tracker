[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for an AI-assisted receipt and expense tracking application"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aio-pika>=9.0.0",
    "boto3>=1.44.10",
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "firebase-admin>=7.8.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.5.2",
    "langchain-mcp-adapters>=0.2.1",
    "langsmith>=0.8.18",
    "langgraph>=1.2.24",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.5",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "redis[hiredis]>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.9",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F",   # pycodestyle + pyflakes
  "I",        # import sorting
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplifications
  "RUF",      # ruff-specific
]
ignore = [
  "E501",     # line-length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
