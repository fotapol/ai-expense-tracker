[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.0.0",
    "boto3>=1.35.0",
    "alembic>=1.18.4",
    "fastapi>=0.133.0",
    "firebase-admin>=7.2.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.2.1",
    "langchain-mcp-adapters>=0.2.1",
    "langsmith>=0.4.32",
    "langgraph>=1.0.9",
    "mcp>=1.26.0",
    "psycopg[binary]>=3.2.0",
    "prometheus-client>=0.22.1",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "redis[hiredis]>=5.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F",   # pycodestyle + pyflakes
  "I",        # import sorting
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplifications
  "RUF",      # ruff-specific
]
ignore = [
  "E501",     # line-length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
