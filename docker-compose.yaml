services:
  # FASTAPI BACKEND
  backend:
    container_name: fastapi
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    ports:
      - 8000:8000
    volumes:
      - ./backend/.secrets/firebase_sa.json:/run/secrets/firebase_sa.json:ro

  # POSTGRESQL DATABASE
  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # REDIS CACHE
  redis:
    container_name: redis
    image: redis:8.2.5
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 6379:6379
    networks:
      - backend

  # MINIO S3 BUCKET
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z  # Pinned version
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend

  # RABBITMQ QUEUE
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.2.4-management
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    ports:
      - "5672:5672"   # AMQP (clients)
      - "15672:15672" # Web UI

  # RECEIPT PROCESSING WORKER
  worker:
    container_name: receipt_worker
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    command: ["uv", "run", "python", "-m", "app.worker.receipt_processor"]
    volumes:
      - ./backend/.secrets/firebase_sa.json:/run/secrets/firebase_sa.json:ro

volumes:
  minio-data:
  postgres-data:
  
networks:
  backend:
    driver: bridge
