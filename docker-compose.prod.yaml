# Production Compose override for a host with a reverse proxy.
# Compose 2.24.4 or later is required for !override.

services:
  site:
    environment:
      APP_ENV: production
    ports: !override
      - "127.0.0.1:3000:8080"

  backend:
    environment:
      APP_ENV: production
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes: !override
      - ./backend/.secrets/firebase_sa.json:/run/secrets/firebase_sa.json:ro
    ports: !override
      - "127.0.0.1:8000:8000"

  worker:
    environment:
      APP_ENV: production
    command: ["/app/.venv/bin/python", "-m", "app.worker.receipt_processor"]
    volumes: !override
      - ./backend/.secrets/firebase_sa.json:/run/secrets/firebase_sa.json:ro

  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"

  minio:
    ports: !override
      - "127.0.0.1:9000:9000"

  rabbitmq:
    ports: !override
      - "127.0.0.1:5672:5672"
