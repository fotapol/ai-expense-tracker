apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-api
  labels:
    app.kubernetes.io/name: expense-tracker-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ai-expense-tracker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: expense-tracker-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: expense-tracker-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ai-expense-tracker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ai-expense-tracker-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              python -c "import base64, os, pathlib; raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON_B64', '').strip(); path = os.environ['FIREBASE_SERVICE_ACCOUNT_PATH']; pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True); pathlib.Path(path).write_bytes(base64.b64decode(raw)) if raw else None" &&
              exec uv run uvicorn app.main:app
              --host 0.0.0.0
              --port 8000
              --proxy-headers
              --forwarded-allow-ips="${UVICORN_FORWARDED_ALLOW_IPS:-*}"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: expense-tracker-config
            - secretRef:
                name: expense-tracker-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
