apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: expense-tracker-site
  namespace: expense-tracker
spec:
  host: nexavend.store
  listener:
    https: https-8443
  tls:
    secret: expense-tracker-origin-tls
    redirect:
      enable: true
  upstreams:
    - name: site
      service: expense-tracker-site
      port: 80
  routes:
    - path: /
      action:
        pass: site
